name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - .github/workflows/ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: node --test image/companion/test/

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: umbrel-orca-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh umbrel-orca-server:ci
