name: Bug report
description: Something is wrong with installing, pairing, the status page, the image, or updates
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Problems in Orca itself (agents, terminals, the desktop or web app) belong in [stablyai/orca](https://github.com/stablyai/orca/issues).

        **Never paste access links (`orca://pair?...`), tokens, or the app password.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the bottom of the status page.
      placeholder: Orca 1.4.224
    validations:
      required: true
  - type: input
    id: umbrel
    attributes:
      label: umbrelOS version and hardware
      placeholder: umbrelOS 1.5 on a Raspberry Pi 5
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Orca client
      placeholder: Orca Desktop 1.4.226 on macOS, or Orca Web in Firefox
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The app's logs from umbrelOS, if they help. Access links are redacted from them.
      render: text
